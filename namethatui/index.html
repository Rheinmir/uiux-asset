<style>

.code{border:1px solid var(--bd);border-radius:12px;background:var(--card);overflow:auto;margin-bottom:10px}.code i{display:block;font:600 10.5px "Geist Mono",monospace;font-style:normal;color:var(--mut);padding:7px 14px;border-bottom:1px solid var(--bd)}.code pre{margin:0;padding:12px 14px;font:12.5px/1.6 "Geist Mono",monospace}
.see{display:grid;gap:8px}.see a{display:flex;justify-content:space-between;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;font-size:14px}.see a:hover{border-color:var(--bd2)}.see span{color:var(--mut);font-size:12px}
.later{margin-top:26px;padding:14px 16px;border:1px dashed var(--bd2);border-radius:12px;color:var(--mut);font-size:13.5px;line-height:1.6}

.sw{height:176px}.sw .s-sw{width:100%;height:100%}.sw .s-sw i{width:140px;height:70px;line-height:70px;font-size:12px}.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px;padding:10px 0 56px}.sc .mat{padding:0;display:block;height:176px}
.vs{display:grid;gap:12px;max-width:760px;margin:0 auto;padding:30px 0 60px}.vs div{border:1px solid var(--bd);border-radius:12px;padding:16px 18px;background:var(--card);line-height:1.6;color:color-mix(in srgb,var(--fg) 85%,transparent)}.vs b{display:block;color:var(--fg);margin-bottom:4px}.vs a{font-size:12.5px;color:var(--blue)}
.spec{max-width:760px;margin:0 auto;padding:30px 0 60px;line-height:1.75;color:color-mix(in srgb,var(--fg) 88%,transparent)}.spec h3{margin:34px 0 10px;font-size:19px;letter-spacing:-.01em;color:var(--fg)}.spec table{border-collapse:collapse;width:100%;font-size:14px}.spec td,.spec th{padding:8px 12px 8px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--bd)}.spec pre{padding:14px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);overflow:auto;font:12.5px/1.6 "Geist Mono",monospace}.spec code{font-size:.9em;color:var(--blue)}
.lic{margin:10px 0 60px;padding:16px 18px;border:1px dashed var(--bd2);border-radius:12px;color:var(--mut);font-size:13.5px;line-height:1.7}.lic b{color:var(--fg)}.lic a{color:var(--blue)}

@media(max-width:860px){.grid,.sg{grid-template-columns:repeat(2,minmax(0,1fr))}.dt{grid-template-columns:1fr;gap:24px}.dmat{position:static;height:300px}}
@media(max-width:600px){.hsearch{display:none}.hd{gap:14px}.hero{padding:56px 0 28px}.grid,.sg{grid-template-columns:minmax(0,1fr)}.tools{width:100%;padding-bottom:10px}.bar{margin-top:30px}.tab{padding:10px 8px}.pill span{display:none}}

    <tr><td><code>/styles</code>, <code>/styles/&lt;slug&gt;</code></td><td>Phong cách thị giác</td><td>${N.styles.length} + 1</td></tr>
    <tr><td><code>/vs</code>, <code>/vs/&lt;a&gt;-vs-&lt;b&gt;</code></td><td>So sánh cặp dễ nhầm</td><td>${N.vs.length} + 1</td></tr>
    <tr><td><code>/swift-vs-electron</code>, <code>/appkit-vs-swiftui</code></td><td>Hai bài so sánh nền tảng/framework</td><td>2</td></tr>
    <tr><td><code>/methodology</code>, <code>/translate</code>, <code>/sponsor</code></td><td>Phương pháp, bản dịch, trang nhà tài trợ</td><td>3</td></tr></table>
    <h3>3. Tính năng nhìn thấy ở trang chủ</h3>
    <ul>
      <li><b>Tìm theo mô tả</b>: ô «Describe the thing…» (phím tắt ⌘K), nhận cả lời mô tả ngoài tên kỹ thuật như «chấm bên dưới slideshow».</li>
      <li><b>Hai chế độ</b>: Elements (thành phần) và Styles (phong cách).</li>
      <li><b>Bộ lọc</b>: Tất cả / macOS / Web; <b>sắp xếp</b>: Newest, Popular, Surprise me.</li>
      <li><b>Thẻ thuật ngữ</b>: có demo sống nhỏ, nhãn nền tảng, nhãn «new», ký hiệu API chính và câu tả một dòng.</li>
      <li><b>Tra nhanh</b>: bấm đúp một từ bất kỳ trên site để xem định nghĩa tiếng thường.</li>
      <li><b>Thương mại</b>: dải nhà tài trợ trên đầu trang (có giá), quảng cáo ứng dụng của chủ site, mục «mới thêm».</li>
    </ul>
    <h3>4. Mô hình dữ liệu suy ra</h3>
<pre>Term {
  slug, name, platform: "macos" | "web", isNew,
  summary,                       // một câu mô tả
  symbols: [{ framework, symbol, note }],   // ví dụ SwiftUI/AppKit/ARIA
  prompt,                        // prompt dán sẵn cho coding agent
  demo,                          // thành phần sống, tương tác được
  anatomy, siblings[]            // giải phẫu và các thuật ngữ gần giống
}</pre>
    <h3>5. Quy trình đưa một thuật ngữ vào (tóm tắt phần Methodology)</h3>
    <ol><li>Bắt đầu từ thứ nhìn thấy mà khó gọi tên, không thêm tên chỉ vì nghe hay.</li><li>Đối chiếu với nguồn gốc: hướng dẫn giao diện của nền tảng, tài liệu framework, chuẩn truy cập.</li><li>Dựng demo và giải thích sao cho phân biệt được với thứ gần giống.</li></ol>
    <p>Nguồn tham chiếu: Apple Human Interface Guidelines và tài liệu nhà phát triển; WAI-ARIA, ARIA APG, WCAG; WHATWG HTML, MDN. Họ dùng thống kê tìm kiếm tổng hợp để cải thiện cách mô tả nhưng không công bố nhật ký truy vấn.</p>
    <h3>6. Công nghệ quan sát được</h3>
    <p>Next.js (App Router), font Geist và Geist Mono, ảnh webp có bản sáng/tối, <code>sitemap.xml</code> và <code>robots.txt</code> cho phép mọi bot.</p>
    <h3>7. Tình trạng giấy phép</h3>
    <p>Đã kiểm: không có LICENSE, trang điều khoản, hay chú thích bản quyền mở. Vì vậy mặc định mọi quyền được bảo lưu. Bản ở đây chỉ dùng tên thuật ngữ và slug (sự kiện), viết lại phần mô tả, tự dựng demo, và dẫn link về trang gốc.</p>
    <h3>8. Đặc tả để dựng lại một bản tương tự (tiêu chí nghiệm thu)</h3>
    <ul><li>Tìm được một thành phần bằng mô tả đời thường, ít nhất khi gõ tên tiếng Việt hay tiếng Anh.</li><li>Mỗi thẻ có demo nhỏ, tên chuẩn, nền tảng, mô tả một câu, nút chép prompt.</li><li>Lọc theo nền tảng, đếm kết quả, trạng thái rỗng có gợi ý.</li><li>Mọi nội dung có nguồn hoặc tự viết; không hotlink ảnh của bên khác.</li><li>Dùng được bằng bàn phím, hiển thị tốt ở 390 px và 1440 px.</li></ul>
  </div>`;

  const licHtml = `<div class="wrap"><div class="lic"><b>Nguồn và bản quyền.</b> Ý tưởng và danh sách thuật ngữ lấy từ <a href="https://namethatui.com/" target="_blank" rel="noopener">namethatui.com</a>. Site đó không công bố giấy phép mở (không có LICENSE hay điều khoản; <code>robots.txt</code> cho phép bot nhưng đó không phải giấy phép), nên trang này <b>không chép</b> chữ, demo, mã hay ảnh của họ. Tên thuật ngữ là sự kiện công khai; mô tả được viết lại bằng tiếng Việt; demo nhỏ do mình tự dựng; mỗi thẻ có đường dẫn về trang gốc để xem bản đầy đủ.</div></div>`;
  const specView = () => `<section class="stitle wrap"><small>ĐẶC TẢ</small><h1>Site gốc vận hành thế nào<em>?</em></h1></section><div class="wrap">${spec()}</div>`;
  const pageView = (key) => { const f = F[key]; const [kind, slug] = key.split('/'); const base = kind === 'styles' ? (N.styles.find((x) => x[0] === slug) || []) : kind === 'vs' ? (N.vs.find((x) => x[0] === slug) || []) : [];
    if (!f && !base[0]) return `<div class="wrap empty">Chưa có trang «${esc(key)}». <a data-t="dict" style="color:var(--blue);cursor:pointer">Về danh sách</a></div>`; const ff = f || {};
    return `<section class="stitle wrap"><small>${kind === 'styles' ? 'PHONG CÁCH' : kind === 'vs' ? 'DỄ NHẦM' : 'TRANG'}</small><h1>${esc(ff.title || base[1] || slug)}</h1>${(ff.lead || base[2]) ? `<p>${esc(ff.lead || base[2])}</p>` : ''}</section><div class="wrap"><div class="spec">${(ff.sections || []).map((x) => `<h3>${esc(x.h)}</h3>${(x.p || []).map((t) => `<p>${esc(t)}</p>`).join('')}`).join('')}<p><a href="https://namethatui.com/${kind === 'page' ? slug : kind + '/' + slug}" target="_blank" rel="noopener" style="color:var(--blue)">Trang gốc ↗</a></p></div></div>`; };
  const body = () => st.tab === 'page' ? pageView(st.key) : st.tab === 'detail' ? detailView(st.key) : st.tab === 'styles' ? stylesView() : st.tab === 'vs' ? vsView() : st.tab === 'spec' ? specView() : dictView();
  function paint() {
    $('app').innerHTML = header() + '<main>' + body() + '</main>' + licHtml + '<footer class="ft"><div class="wrap">gọi tên ui · một trang của <a href="/" style="color:var(--blue)">uiux-asset</a> · mô tả và demo tự viết, ý tưởng từ <a href="https://namethatui.com/" target="_blank" rel="noopener" style="color:var(--blue)">NameThatUI</a></div></footer>';
    const q = $('q'); if (q) q.addEventListener('input', () => { st.q = q.value; $('grid').innerHTML = list(); });
    const sq = $('sq'); if (sq) sq.addEventListener('input', () => { st.sq = sq.value; $('sgrid').innerHTML = styleCards(); });
    $('theme').onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('ovs-theme', d.dataset.theme); } catch { /* bỏ qua */ } };
  }
  function route() {
    let h = location.hash.slice(1).replace(/^\//, '');
    if (!h && PATHMODE) { h = location.pathname.replace(BASE, '').replace(/^\/+|\/+$/g, ''); if (h === 'index.html') h = ''; }
    if (PATHMODE && location.hash && h) history.replaceState(null, '', BASE + h + (location.search || ''));   // liên kết cũ dạng #/ được đổi sang đường dẫn thật
    const m = /^(web|macos)\/([a-z0-9-]+)$/.exec(h), m2 = /^(styles|vs|page)\/([a-z0-9-]+)$/.exec(h);
    if (m) { st.tab = 'detail'; st.key = h; } else if (m2) { st.tab = 'page'; st.key = h; } else st.tab = ['styles', 'vs', 'spec'].includes(h) ? h : 'dict';
    paint(); scrollTo(0, 0);
    const it = st.tab === 'detail' ? byKey(st.key) : null; document.title = (it ? it.r[1] + ' · ' : st.tab === 'dict' ? '' : { styles: 'Phong cách · ', vs: 'Dễ nhầm · ', spec: 'Đặc tả · ', page: '' }[st.tab] || '') + 'Gọi tên UI — uiux-asset';
  }
  const focusSearch = () => { if (st.tab !== 'dict') go('dict'); setTimeout(() => { const q = $('q'); if (q) { q.focus(); q.scrollIntoView({ block: 'center' }); } }, 60); };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-t],[data-p],[data-sort],[data-rand],[data-cp],[data-focus]'); if (!t) return;
    if (t.dataset.t) { e.preventDefault(); go(t.dataset.t); }
    else if (t.dataset.p) { st.plat = t.dataset.p; setUrlPlat(st.plat); paint(); }
    else if (t.dataset.sort) { st.sort = t.dataset.sort; paint(); }
    else if (t.dataset.rand !== undefined) { const it = all[Math.floor(Math.random() * all.length)]; go(it.p + '/' + it.r[0]); }
    else if (t.dataset.focus !== undefined) focusSearch();
    else { const it = byKey(t.dataset.cp); if (it) { const txt = (F[t.dataset.cp] && F[t.dataset.cp].prompt) || prompt(it.p, it.r), s = t.querySelector('span'); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { s.textContent = 'Đã chép'; }).catch(() => { s.textContent = 'Không chép được'; }); setTimeout(() => { s.textContent = 'Chép prompt'; }, 1500); } }
  });

  // ---------- bảng lệnh ⌘K ----------
  const pal = { open: false, q: '', plat: 'all', sel: 0, items: [] };
  const palSearch = () => { const q = pal.q.trim().toLowerCase(); const toks = q.split(/\s+/).filter(Boolean);
    const rows = [...all.filter(({ p }) => pal.plat === 'all' || pal.plat === p).map(({ p, r }) => { const f = F[p + '/' + r[0]] || {}; return { kind: p, key: p + '/' + r[0], title: r[1], sym: f.sym || SYM[r[0]] || '', sum: f.lead || r[2], hay: [r[0], r[1], r[2], f.sym || SYM[r[0]] || '', (f.aka || []).join(' '), (f.phrases || []).join(' ')].join(' ').toLowerCase(), tag: PLAT[p] }; }),
      ...(pal.plat === 'all' ? N.styles.map(([k, n, d]) => ({ kind: 'styles', key: 'styles/' + k, title: n, sym: '', sum: (F['styles/' + k] && F['styles/' + k].lead) || d, hay: (k + ' ' + n + ' ' + d).toLowerCase(), tag: 'PHONG CÁCH' })) : [])];
    const scored = rows.map((x) => { if (!toks.length) return [x, 1]; let sc = 0; for (const t of toks) { if (x.title.toLowerCase().startsWith(t)) sc += 5; else if (x.title.toLowerCase().includes(t)) sc += 3; else if (x.hay.includes(t)) sc += 1; else return [x, 0]; } return [x, sc]; }).filter(([, sc]) => sc > 0).sort((a, b) => b[1] - a[1]);
    return scored.slice(0, 8).map(([x]) => x); };
  function palPaint(keepFocus) { const el = $('pal'); if (!el) return; pal.items = palSearch(); if (pal.sel >= pal.items.length) pal.sel = 0;
    el.querySelector('.rs').innerHTML = pal.items.length ? pal.items.map((x, i) => `<div class="r" role="option" data-i="${i}" aria-selected="${i === pal.sel}"><b>${esc(x.title)}</b><span class="tg">${x.tag}</span>${x.sym ? `<span class="sy">${esc(x.sym)}</span>` : ''}<p>${esc(x.sum)}</p></div>`).join('') : '<div class="none">Không khớp mục nào. Thử mô tả hình dạng hoặc vị trí.</div>';
    el.querySelectorAll('.hs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pp === pal.plat))); const s = el.querySelector('.rs [aria-selected="true"]'); if (s) s.scrollIntoView({ block: 'nearest' }); }
  function palOpen() { if (pal.open) return; pal.open = true; pal.q = ''; pal.sel = 0; const d = document.createElement('div'); d.className = 'pal-bd'; d.id = 'palbd';
    d.innerHTML = `<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Tìm thành phần"><div class="pi">${ICON.search}<input id="pq" placeholder="Mô tả thứ bạn thấy…" autocomplete="off" aria-label="Tìm"><span class="kbd">esc</span></div><div class="rs" role="listbox"></div><div class="hs"><span>Chưa chắc? Bạn thấy nó ở đâu?</span><button data-pp="web">Trên website</button><button data-pp="macos">Trong app Mac</button></div><div class="ft"><span>${all.length} thành phần · ${N.styles.length} phong cách</span><span>↑↓ chọn · ↵ mở · esc đóng</span></div></div>`;
    document.body.append(d); document.body.style.overflow = 'hidden'; palPaint(); $('pq').focus();
    d.addEventListener('mousedown', (e) => { if (e.target === d) palClose(); });
    d.addEventListener('click', (e) => { const r = e.target.closest('.r'), b = e.target.closest('[data-pp]'); if (r) palGo(+r.dataset.i); else if (b) { pal.plat = pal.plat === b.dataset.pp ? 'all' : b.dataset.pp; pal.sel = 0; palPaint(); $('pq').focus(); } });
    $('pq').addEventListener('input', (e) => { pal.q = e.target.value; pal.sel = 0; palPaint(); }); }
  function palClose() { const d = $('palbd'); if (d) d.remove(); pal.open = false; document.body.style.overflow = ''; }
  function palGo(i) { const x = pal.items[i]; if (!x) return; palClose(); go(x.key); }
  document.addEventListener('keydown', (e) => {
    if (pal.open) { if (e.key === 'Escape') { e.preventDefault(); palClose(); } else if (e.key === 'ArrowDown') { e.preventDefault(); pal.sel = Math.min(pal.items.length - 1, pal.sel + 1); palPaint(); } else if (e.key === 'ArrowUp') { e.preventDefault(); pal.sel = Math.max(0, pal.sel - 1); palPaint(); } else if (e.key === 'Enter') { e.preventDefault(); palGo(pal.sel); } return; }
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); } else if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); palOpen(); }
  }, true);
  document.addEventListener('click', (e) => { if (e.target.closest('[data-pal]')) { e.preventDefault(); palOpen(); } const bg = e.target.closest('#burger'); if (bg) { const m = $('mnav'); const on = m.classList.toggle('on'); bg.setAttribute('aria-expanded', String(on)); bg.setAttribute('aria-label', on ? 'Đóng điều hướng' : 'Mở điều hướng'); } else if (e.target.closest('#mnav a')) { $('mnav').classList.remove('on'); } });
  // ---------- nền tảng trong URL (?platform=) ----------
  const urlPlat = () => { try { const v = new URLSearchParams(location.search).get('platform'); return ['web', 'macos'].includes(v) ? v : 'all'; } catch { return 'all'; } };
  const setUrlPlat = (v) => { try { const u = new URL(location.href); if (v === 'all') u.searchParams.delete('platform'); else u.searchParams.set('platform', v); history.replaceState(null, '', u); } catch { /* bỏ qua */ } };
  st.plat = urlPlat();
  // ---------- hành động ở trang thuật ngữ ----------
  const mdOf = (key) => { const it = byKey(key); if (!it) return ''; const { p, r } = it, f = F[key] || {}, sy = f.sym || SYM[r[0]];
    return [`# ${r[1]}`, sy ? `\`${sy}\`` : '', f.aka && f.aka.length ? `_Còn gọi là: ${f.aka.join(', ')}_` : '', f.def || r[2], f.phrases && f.phrases.length ? `## Nếu bạn gọi nó là…\n${f.phrases.map((x) => `- “${x}”`).join('\n')}` : '', f.anatomy && f.anatomy.length ? `## Giải phẫu\n${f.anatomy.map((a, i) => `${i + 1}. **${a.n}**${a.sym ? ` (\`${a.sym}\`)` : ''}: ${a.d || ''}`).join('\n')}` : '', `## Prompt\n${f.prompt || prompt(p, r)}`, f.debug ? `## Prompt gỡ lỗi\n${f.debug}` : '', `Nguồn ý tưởng: https://namethatui.com/${p}/${r[0]}`].filter(Boolean).join('\n\n'); };
  const flash = (t, s, msg) => { s.textContent = msg; setTimeout(() => { s.textContent = t; }, 1500); };
  const copy = (txt, s, label, done) => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => flash(label, s, done)).catch(() => flash(label, s, 'Không chép được'));
  const savedSet = () => { try { return new Set(JSON.parse(localStorage.getItem('ntu-saved') || '[]')); } catch { return new Set(); } };
  document.addEventListener('click', (e) => { const t = e.target.closest('[data-md],[data-share],[data-save]'); if (!t) return; const s = t.querySelector('span');
    if (t.dataset.md) copy(mdOf(t.dataset.md), s, 'Chép dạng Markdown', 'Đã chép Markdown');
    else if (t.dataset.share) { const it = byKey(t.dataset.share); const url = location.href.split('?')[0] + (location.hash || ''); if (navigator.share) navigator.share({ title: it ? it.r[1] : 'Gọi tên UI', url }).catch(() => {}); else copy(url, s, 'Chia sẻ', 'Đã chép liên kết'); }
    else { const set = savedSet(), k = t.dataset.save; if (set.has(k)) set.delete(k); else set.add(k); try { localStorage.setItem('ntu-saved', JSON.stringify([...set])); } catch { /* bỏ qua */ } s.textContent = set.has(k) ? 'Đã lưu' : 'Lưu'; } });

  addEventListener('hashchange', route); addEventListener('popstate', route);
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="/namethatui/"]'); if (!PATHMODE || !a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank' || e.defaultPrevented) return; e.preventDefault(); history.pushState(null, '', a.getAttribute('href') + (location.search || '')); route(); });
  route(); window.__nt = { st, count: all.length, route };
})();
</script></body></html>
