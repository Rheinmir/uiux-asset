<!-- Phần xương «Status dot» (web/status-dot): avatar + chấm trạng thái + tên/trạng thái. HTML ngữ nghĩa + biến --sk-*.
     Cổng: tools/ntu-gate/skeleton.cjs (so namethatui.com kể cả chữ, ngưỡng 100). Chữ là slot, cổng dùng chữ gốc tiếng Anh. -->
<style>
.sk-sd{--sk-font:"Geist Sans","Geist",system-ui,sans-serif;font-feature-settings:"ss09";-webkit-font-smoothing:antialiased;
  --sk-mat:rgb(25,27,31);--sk-ink:rgb(255,255,255);--sk-ink-2:oklab(0.999994 0.0000455678 0.0000200868/.55);
  --sk-ok:lab(66.9756 -58.27 19.5419);--sk-av:linear-gradient(140deg,rgb(255,138,92),rgb(217,65,140));
  position:absolute;left:-1px;top:-1px;width:312px;height:176px;display:grid;place-items:center;font-family:var(--sk-font)}
.sk-sd .who{display:flex;align-items:center;gap:12px}
.sk-sd .av{position:relative;width:64px;height:64px;border-radius:999px;background:var(--sk-av);display:grid;place-items:center;color:var(--sk-ink);font:600 20px/22px var(--sk-font)}
.sk-sd .dot{position:absolute;left:47px;top:47px;width:18px;height:18px;box-sizing:border-box;border:2px solid var(--sk-mat);border-radius:999px;background:var(--sk-ok)}
.sk-sd .tx{display:flex;flex-direction:column;gap:2px}
.sk-sd .nm{color:var(--sk-ink);font:600 13px/16.25px var(--sk-font)}
.sk-sd .st{color:var(--sk-ink-2);font:400 11px/13.75px var(--sk-font)}
</style>
<div class="sk-sd">
  <div class="who">
    <span class="av" role="img" aria-label="Ava Reyes, online">AR<span class="dot" aria-hidden="true"></span></span>
    <span class="tx"><span class="nm">Ava Reyes</span><span class="st">Online</span></span>
  </div>
</div>
