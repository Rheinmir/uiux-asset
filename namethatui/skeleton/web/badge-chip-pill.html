<!-- Phần xương «Badge / Chip / Pill / Tag» (web/badge-chip-pill). HTML ngữ nghĩa + biến --sk-*: kit nào cũng đổi token là dùng được.
     Chuẩn: tools/ntu-gate/skeleton.cjs chấm so ảnh namethatui.com (kể cả chữ), ngưỡng 100. Chữ là slot, cổng dùng chữ gốc tiếng Anh. -->
<style>
.sk-bcp{--sk-cap:lab(65.5349 -2.25151 -14.5072);--sk-surface:rgb(46,47,52);--sk-icon:lab(84.7652 -1.94535 -7.93337);
  --sk-danger:lab(55.4814 75.0732 48.8528);--sk-ring:lab(7.78673 1.82345 -15.0537);--sk-info:rgb(78,161,255);
  --sk-ok:lab(90.2247 -31.039 9.47084);--sk-ok-bg:oklab(0.764996 -0.16946 0.0511031/.15);
  --sk-warn:lab(91.7203 -0.505269 49.9084);--sk-warn-bg:oklab(0.828004 0.0183412 0.188111/.1);--sk-warn-bd:oklab(0.879003 -0.00473928 0.168942/.2);
  --sk-font:"Geist Sans","Geist",system-ui,sans-serif;font-feature-settings:"ss09";-webkit-font-smoothing:antialiased;
  position:absolute;left:-1px;top:-1px;width:312px;height:176px;display:grid;place-items:center;font-family:var(--sk-font)}
.sk-bcp .g{display:grid;grid-template-columns:repeat(2,72.125px);column-gap:19.875px;row-gap:16px;margin:0}
.sk-bcp figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sk-bcp figcaption{font:600 9px/13.5px var(--sk-font);letter-spacing:.45px;text-transform:uppercase;color:var(--sk-cap)}
.sk-bcp .slot{height:40px;display:flex;align-items:center}
.sk-bcp .ib{position:relative;width:36px;height:36px;border:0;padding:0;border-radius:10px;background:var(--sk-surface);color:var(--sk-icon);font:400 16px/19px var(--sk-font)}
.sk-bcp .badge{position:absolute;left:26px;top:-6px;min-width:16px;height:16px;border-radius:999px;background:var(--sk-danger);box-shadow:0 0 0 2px var(--sk-ring);color:#fff;font:700 9px/16px var(--sk-font);text-align:center}
.sk-bcp .chip{height:28px;padding:0 10px;border-radius:8px;background:color-mix(in srgb,var(--sk-info) 10%,transparent);color:var(--sk-info);font:500 11px/28px var(--sk-font)}
.sk-bcp .pill{width:72.125px;height:28px;box-sizing:border-box;padding-left:12px;display:flex;align-items:center;gap:4px;border-radius:999px;background:var(--sk-ok-bg);color:var(--sk-ok);font:500 11px/12px var(--sk-font)}
.sk-bcp .pill svg{width:11px;height:11px;flex:none}
.sk-bcp .tag{height:25px;box-sizing:border-box;padding:0 8px;border:1px solid var(--sk-warn-bd);border-radius:4px;background:var(--sk-warn-bg);color:var(--sk-warn);font:500 10px/23px var(--sk-font);letter-spacing:.25px;text-transform:uppercase}
</style>
<div class="sk-bcp">
  <div class="g">
    <figure><figcaption>Badge</figcaption><div class="slot"><button class="ib" type="button" aria-label="Inbox, 7 unread">✉<span class="badge" aria-hidden="true">7</span></button></div></figure>
    <figure><figcaption>Chip</figcaption><div class="slot"><span class="chip">Design</span></div></figure>
    <figure><figcaption>Pill</figcaption><div class="slot"><span class="pill" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Active</span></div></figure>
    <figure><figcaption>Tag</figcaption><div class="slot"><span class="tag">Web</span></div></figure>
  </div>
</div>
