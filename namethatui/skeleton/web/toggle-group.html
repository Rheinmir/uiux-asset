<!-- Phần xương «Toggle group» (web/toggle-group): nhóm nút chọn một, aria-pressed, vạch ngăn giữa các nút. Icon: Lucide text-align (ISC).
     Cổng: tools/ntu-gate/skeleton.cjs (so namethatui.com kể cả chữ, ngưỡng 100). Chữ là slot, cổng dùng chữ gốc tiếng Anh. -->
<style>
.sk-tg{--sk-font:"Geist Sans","Geist",system-ui,sans-serif;font-feature-settings:"ss09";-webkit-font-smoothing:antialiased;
  --sk-surface:rgb(35,36,40);--sk-line:oklab(0.999994 0.0000455678 0.0000200868/.1);--sk-icon:lab(84.7652 -1.94535 -7.93337);
  --sk-accent:rgb(78,161,255);--sk-on-accent:rgb(255,255,255);--sk-cap:lab(65.5349 -2.25151 -14.5072);
  --sk-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);
  position:absolute;left:-1px;top:-1px;width:312px;height:176px;display:grid;place-items:center;font-family:var(--sk-font)}
.sk-tg .wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.sk-tg .grp{display:flex;padding:2px;border:1px solid var(--sk-line);border-radius:10px;background:var(--sk-surface);box-shadow:var(--sk-shadow)}
.sk-tg button{position:relative;width:38px;height:36px;border:0;padding:0;border-radius:8px;background:none;color:var(--sk-icon);display:grid;place-items:center}
.sk-tg button + button::before{content:"";position:absolute;left:-1px;top:8px;width:1px;height:20px;background:var(--sk-line)}
.sk-tg button[aria-pressed="true"]{background:var(--sk-accent);color:var(--sk-on-accent);box-shadow:var(--sk-shadow)}
.sk-tg svg{width:14px;height:14px}
.sk-tg p{margin:0;color:var(--sk-cap);font:400 10px/15px var(--sk-font)}
</style>
<div class="sk-tg">
  <div class="wrap">
    <div class="grp" role="group" aria-label="Text alignment">
      <button type="button" aria-pressed="false" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 5H3M15 12H3M17 19H3"/></svg></button>
      <button type="button" aria-pressed="true" aria-label="Center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 5H3M17 12H7M19 19H5"/></svg></button>
      <button type="button" aria-pressed="false" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 5H3M21 12H9M21 19H7"/></svg></button>
    </div>
    <p>Single selection · <output>center</output></p>
  </div>
</div>
