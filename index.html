<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>uiux-asset</title>
<meta name="description" content="Code gốc nguyên văn các pattern UI/UX — hiệu ứng cuộn, component, UI kit rút từ site thật. Xem chạy thật, copy nguyên file.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ovs-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="aw.css?v=66b5871e1e"></head><body>
<main class="aw-wrap"><script src="aw.js?v=66b5871e1e"></script>
<div class="aw-sotd" style="padding-top:16px"><p class="aw-sotd__sub"><span>Kho pattern UI/UX</span><span class="aw-tag aw-tag--medium">Code gốc nguyên văn</span></p>
<h1 class="aw-h1" style="--aw-h1:clamp(42px,9.4vw,126.7px)">uiux asset<span class="aw-sticker" aria-hidden="true"></span></h1>
<p class="aw-lead">Bốn nhóm: thành phần, màn hình, chuyển động, tài nguyên. Xem chạy thật, copy nguyên file.</p></div>
<div class="aw-home-search" data-ovs-search></div>
<nav class="aw-kpis aw-kpis--4" aria-label="Bốn nhóm" id="cat-kpis"></nav>
<div id="cats"></div>
</main>
<script>{
const fmt = (n) => n.toLocaleString('vi-VN'), C = ['--aw-sticker-4', '--aw-sticker-1', '--aw-sticker-3', '--aw-sticker-7'];
const sum = (it) => it.reduce((t, x) => t + (x[3] || 1), 0);
const shot = ([p, t, , , v]) => v === '@galaxy' ? '<span class="aw-shot gx-mosaic" id="gx-mosaic"></span>'
  : v && /\.(jpe?g|webp|png|gif)$/.test(v) ? `<img src="${v}" alt="" loading="lazy">`
  : `<span class="aw-shot"><iframe loading="lazy" src="${v || p}" title="Xem trước ${t}" tabindex="-1" aria-hidden="true"></iframe></span>`;
document.getElementById('cat-kpis').innerHTML = AW_CAT.map(([id, g, , it], i) => `<a href="#${id}" style="--c:var(${C[i]})"><b>${fmt(sum(it))}</b><span>${g}</span></a>`).join('');
document.getElementById('cats').innerHTML = AW_CAT.map(([id, g, d, it]) => `<section class="aw-cat" id="${id}" aria-labelledby="${id}-h">
  <div class="aw-sec-h"><h2 id="${id}-h">${g}</h2><span><b>${it.length} bộ</b>${d}</span></div>
  <div class="aw-cat__grid">${it.map((x) => `<div class="aw-card-slide"><a class="aw-fig is-large" href="${x[0]}" aria-label="Mở ${x[1]}">${shot(x)}</a>
  <div class="aw-card-slide__foot"><h3 class="aw-card-slide__title"><a href="${x[0]}">${x[1]}</a></h3>${x[3] ? `<span class="aw-tag aw-tag--bold"${x[0] === 'ui-kits/' ? ' id="kit-total"' : ''}>${fmt(x[3])}</span>` : ''}<p>${x[2]}</p></div></div>`).join('')}</div></section>`).join('');
}</script>
<script src="ui-kits/kits.js?v=66b5871e1e"></script><script src="galaxy/galaxy.js?v=66b5871e1e"></script>
<script>awGalaxy.load().then((all) => { const m = document.getElementById('gx-mosaic');   // 4 element đầu tiên không dùng Tailwind của 4 nhóm
  m.append(...['Buttons', 'loaders', 'Toggle-switches', 'Checkboxes'].map((c) => awGalaxy.frame(all.find((it) => it[0] === c && !it[5])))); }).catch(() => {});
awKits.load().then((k) => { document.getElementById('kit-total').textContent = k.length; }).catch(() => {});</script>
<script src="/search.js?v=66b5871e1e" defer></script><script src="/stats.js?v=66b5871e1e" defer></script></body></html>
