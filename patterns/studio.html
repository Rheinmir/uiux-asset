const panel = document.getElementById('st'), stage = document.getElementById('st-stage'), ct = document.getElementById('st-ct'), eye = document.getElementById('st-eye');
const hd = document.getElementById('st-h'), cta = document.getElementById('st-cta'), pz = document.getElementById('st-pause'), list = document.getElementById('st-list');
const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = (n, k) => String(n).padStart(k, '0');
const url = (v) => v.href || `https://github.com/${v.repo}`;
list.innerHTML = V.map((v) => `<li><a href="${url(v)}" target="_blank" rel="noopener">${v.en}</a><b>★ ${v.star}</b><small>${v.repo} · ${v.desc}</small></li>`).join('');

const card = (i, d, clone) => { const v = V[i];
  return `<article class="st-card" data-i="${i}" style="--d:${d};--r:${(i % 3 - 1) * 4}deg"${clone ? ' inert' : ''}>
  <div class="st-head"><div><h3><a href="${url(v)}" target="_blank" rel="noopener">${v.en}</a></h3><div class="st-tag" style="--t:${T[v.tone]}">${v.tag}</div></div><span class="st-n">${pad(i + 1, 2)}</span></div>
  <div class="st-demo" style="--h:${v.h}px" aria-hidden="true">${v.html}</div>
  <p class="st-use">${v.vi}. ${v.use}</p>
  <div class="st-foot"><span>${v.foot.join(' · ')}</span><b class="st-star">★ ${v.star} ↗</b></div></article>`; };

// Cột: 4 / 3 / 2 / 1 theo bề rộng; mỗi cột lặp bộ thẻ 3 lần để cuộn vòng liền mạch.
const COLS = [[1100, 4], [860, 3], [560, 2], [0, 1]], SPD = [26, 40, 31, 46];
let tracks = [], off = [], nc = 0, on = -1;
const build = () => {
  const n = COLS.find(([w]) => innerWidth >= w)[1]; if (n === nc) return; nc = n;
  const copies = rm ? 1 : 3;
  stage.innerHTML = rep(n, (c) => { const ids = V.map((_, i) => i).filter((i) => i % n === c);
    return `<div class="st-col"><div class="st-track" data-m="${ids.length}">${rep(copies, (k) => ids.map((i, r) => card(i, r * n + c, k > 0)).join(''))}</div></div>`; });
  tracks = [...stage.querySelectorAll('.st-track')]; off = tracks.map((_, c) => c * 137); mark();
};
const mark = () => stage.querySelectorAll('.st-card').forEach((c) => c.classList.toggle('is-on', +c.dataset.i === on));

// Nhịp: đổi theme daisyUI, dời khoảng ngày Mantine, viền cam đi qua 15 thẻ rồi tới tiêu đề cuối.
let k = 0, tour = -2, paused = false, hover = false;
const days = () => { const s = 5 + k % 3; stage.querySelectorAll('.mt-g').forEach((g) => [...g.children].forEach((e, d) => { e.classList.toggle('in', d + 1 >= s && d + 1 <= s + 5); e.classList.toggle('end', d + 1 === s || d + 1 === s + 5); })); };
const step = () => {
  k++; panel.dataset.k = k % 3; days();
  if (tour >= 0 && tour < 15) { on = tour; ct.textContent = `${pad(tour + 1, 3)} / 015`; eye.textContent = `${pad(tour + 1, 2)} · ${V[tour].repo}`; mark(); }
  else if (tour === 15) { on = -1; mark(); ct.textContent = '001–015'; eye.textContent = '830K+ STARS · $0 · ALL OPEN SOURCE'; eye.classList.add('is-hot');
    hd.textContent = 'Figma, meet your replacement.'; cta.textContent = 'All 15 links below ↓'; cta.classList.add('is-fill'); }
  tour++;
};
build(); days();
cta.onclick = () => list.scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block: 'start' });

if (rm) panel.classList.add('is-static');
else {
  addEventListener('resize', () => { build(); days(); });
  panel.classList.add('st-js');
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { panel.classList.add('is-in'); o.disconnect(); } }, { threshold: .05 }).observe(stage);
  setInterval(() => { if (!paused && !document.hidden) step(); }, 1400);
  let last = 0;
  const loop = (ms) => { const dt = Math.min(.05, (ms - last) / 1000 || 0); last = ms;
    if (!paused && !hover) tracks.forEach((t, c) => { const h = t.children[+t.dataset.m].offsetTop; if (!h) return;
      off[c] = (off[c] + SPD[c % 4] * dt) % h; t.style.transform = `translate3d(0,${-off[c].toFixed(1)}px,0)`; });
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  stage.addEventListener('pointerenter', () => { hover = true; });
  stage.addEventListener('pointerleave', () => { hover = false; });
  stage.addEventListener('focusin', () => { hover = true; });
  stage.addEventListener('focusout', () => { hover = false; });
  pz.onclick = () => { paused = !paused; panel.classList.toggle('is-paused', paused); pz.setAttribute('aria-pressed', paused); pz.textContent = paused ? '▶ Chạy' : '❚❚ Dừng'; };
}
