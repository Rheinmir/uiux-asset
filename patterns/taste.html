{ id: 'pay', kind: 'app', w: 300, h: 620, vi: 'Gửi và nhận tiền', en: 'Send & get paid',

  html: PH('tx-pay', `<div class="top"><b>bloop</b><span><em>€12,406.20</em> ready</span></div><h3>send<span>get paid</span></h3><div class="frame"></div><div class="blob"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#ff3fa4" d="M50 6c12 0 18 10 20 18 8-2 22 2 24 16s-8 18-12 20c4 6 6 22-8 28s-20-2-24-6c-4 4-12 12-26 6S8 66 12 60C6 56-2 44 8 32s18-8 24-8c2-8 8-18 18-18z"/></svg><b>ln</b></div><div class="who"><span>linh nguyen</span><small>photographer · hanoi</small></div><div class="ppl" role="group" aria-label="Người nhận">${['ln', 'sb', 'tv', 'po', 'kp'].map((x, i) => `<button type="button" aria-pressed="${i === 0}">${x}</button>`).join('')}</div><button type="button" class="tx-btn go" aria-label="Gửi">${I('ne', 26)}</button><div class="lands">lands in<br>seconds<small>no fee</small></div><div class="amt">€1,840</div>`),
  js: (el) => { const P = { ln: ['linh nguyen', 'photographer · hanoi', '€1,840'], sb: ['sami berg', 'chef · oslo', '€420'], tv: ['tomas vale', 'cellist · porto', '€96'], po: ['pia ortiz', 'architect · lima', '€2,310'], kp: ['kim park', 'student · seoul', '€55'] };

{ id: 'weather', kind: 'app', w: 300, h: 620, vi: 'Thời tiết mặt số', en: 'Weather dial',

.tx-weather .tiles b{font-size:24px;line-height:1}
.tx-weather .tiles small{font-weight:400;font-size:10px;margin-left:4px}

.tx-weather .bar .tx-btn{width:40px;height:40px;background:#fff;font:600 12px/1 Inter;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.tx-weather .bar .pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:999px;background:#111;color:#fff;font:500 12px/1 Inter;cursor:pointer}`,
  html: PH('tx-weather', `<div class="city">Madrid<small>Tuesday 26 May</small></div><div class="now tx-dot">16:50<small>in 7 h 19</small></div><div class="dial"></div><div class="sun"></div><div class="deg tx-dot">29°</div><div class="feel">Hot and clear<small>Feels 31°</small></div><div class="bars"><div>UV 6<span>High</span></div><div>Rain 10%<span>Slight</span></div></div><div class="tiles"><div>Wind<span><b class="tx-dot">21</b><small>km/h · gusts 32</small></span></div><div>Air<span><b class="tx-dot">89</b><small>AQI · PM2.5 18</small></span></div></div><div class="bar"><button type="button" class="tx-btn" aria-label="Đổi độ">°C</button><button type="button" class="pill">${I('pause', 14)}<span>Pause the day</span></button><button type="button" class="tx-btn" aria-label="Vị trí">${I('send', 16)}</button></div>`),

    u.onclick = () => { c = !c; u.textContent = c ? '°C' : '°F'; d.textContent = c ? '29°' : '84°'; }; } },

{ id: 'orbit', kind: 'app', w: 300, h: 620, vi: 'Lịch quanh quả cầu', en: 'Orbit launcher',

  html: PH('tx-orbit', `<div class="top"><span>Orbit</span><small>Tue 18 Nov · 8 live</small></div><div class="next"><b>Next up</b><small>Starts in</small><div class="t tx-dot">12:46</div><i></i><em>Pricing review</em><small>10:30 · Room 2 · Ines, Kofi and 2 more</small><span class="tx-btn ne">${I('ne', 14)}</span></div><div class="core"></div>${[['cam', 120, 280, '#ff2d55', ''], ['home', 34, 330, '#ff7ab8', ''], ['bell', 210, 330, '#e6f34a', 3], ['clock', 0, 420, '#c9ccd3', ''], ['doc', 250, 420, '#2ed9a3', ''], ['list', 40, 510, '#ff9a2e', 3], ['mail', 210, 510, '#45d6f0', 4]].map(([n, x, y, c, s]) => `<span class="ball" style="left:${x}px;top:${y}px;background:radial-gradient(circle at 35% 30%,#fff,${c} 45%)">${I(n, 16)}${s ? `<sup>${s}</sup>` : ''}</span>`).join('')}<div class="bar">${I('key', 18)}<button type="button" class="mic" aria-label="Nói">${I('mic', 16)}<span></span></button>${I('loop', 18)}</div>`),
  js: (el) => { const t = el.querySelector('.t'); let s = 12 * 60 + 46;

  html: PH('tx-shop', `<div class="top"><span class="tx-btn">${I('back', 16)}</span><span>FERRO</span><span class="tx-btn">${I('bag', 16)}</span></div><div class="big">24</div><svg class="pot" viewBox="0 0 220 180" aria-hidden="true"><defs><linearGradient id="txp" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".35" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient></defs><ellipse cx="110" cy="166" rx="80" ry="10" fill="#000" opacity=".3"/><rect x="8" y="78" width="30" height="16" rx="8" class="c"/><rect x="182" y="78" width="30" height="16" rx="8" class="c"/><path class="c" d="M26 74h168v58c0 22-30 36-84 36s-84-14-84-36z"/><path fill="url(#txp)" d="M26 74h168v58c0 22-30 36-84 36s-84-14-84-36z"/><ellipse class="c" cx="110" cy="72" rx="90" ry="22"/><ellipse fill="#fff" opacity=".12" cx="110" cy="66" rx="70" ry="12"/><rect x="100" y="34" width="20" height="18" rx="4" fill="#c9a24a"/><ellipse cx="110" cy="34" rx="18" ry="6" fill="#e2c06a"/></svg><div class="sw" role="group" aria-label="Màu">${[['#1d5b3a', 'Pine green'], ['#c99a1a', 'Mustard'], ['#b8325c', 'Rosehip']].map(([c, n], i) => `<button type="button" aria-pressed="${i === 0}" aria-label="${n}" data-c="${c}" style="background:${c}"></button>`).join('')}<span>Pine green</span></div><div class="name">Enamelled cast iron · Nº2<b>Cocotte<span>€189</span></b><p>Poured in one piece. Oven to table, any hob, 30-year guarantee.</p></div><div class="size"><header><span>Size</span><span class="l">4.2 L · serves 4</span></header><div role="group" aria-label="Cỡ">${[20, 24, 28, 32].map((s) => `<button type="button" aria-pressed="${s === 24}">${s}</button>`).join('')}</div></div><button type="button" class="add"><span>${I('bag', 14)} Add to bag</span><b>€189</b></button>`),
  js: (el) => { const ph = el.querySelector('.tx-shop'), paint = (c) => { ph.style.setProperty('--c', c); el.querySelectorAll('.pot .c').forEach((p) => p.setAttribute('fill', c)); };

{ id: 'globe', kind: 'ui', w: 460, h: 340, vi: 'Quả cầu chấm', en: 'Dot globe',
  use: 'Mạng lưới toàn cầu, số người dùng theo nước. Quả cầu chấm xoay chậm, vài điểm sáng là văn phòng.',
  css: `.tx-globe{width:460px;height:340px;display:grid;place-items:center;border-radius:22px;background:radial-gradient(circle at 50% 50%,#141a2e,#05060a 70%)}
.tx-globe canvas{width:300px;height:300px}`,
  html: `<div class="tx-globe"><canvas width="600" height="600" aria-label="Quả cầu xoay"></canvas></div>`,
  js: (el) => { const c = el.querySelector('canvas'), x = c.getContext('2d'), R = 270, pins = [[48, 2], [40, -74], [-23, -46], [35, 139], [1, 104], [-34, 18]];
    // ponytail: lục địa là hàm sóng giả, không phải bản đồ thật; muốn đúng thì nạp mặt nạ đất 1-bit.
    const land = (la, lo) => Math.sin(lo * .05 + 1) * Math.cos(la * .07) + Math.sin(lo * .11 - la * .05) * .6 + Math.cos(la * .12 + lo * .03) * .35 > -.05;
    let a = 0; const draw = () => { x.clearRect(0, 0, 600, 600); x.fillStyle = '#0b0e1c'; x.beginPath(); x.arc(300, 300, R, 0, 7); x.fill();
      const g = x.createRadialGradient(300, 300, R * .8, 300, 300, R + 8); g.addColorStop(0, 'rgba(60,80,255,0)'); g.addColorStop(1, 'rgba(70,90,255,.55)'); x.fillStyle = g; x.beginPath(); x.arc(300, 300, R + 8, 0, 7); x.fill();
      for (let la = -80; la <= 80; la += 3.2) for (let lo = -180; lo < 180; lo += 3.2 / Math.cos(la * Math.PI / 180)) {
        const p = la * Math.PI / 180, l = (lo + a) * Math.PI / 180, z = Math.cos(p) * Math.cos(l); if (z < 0) continue;
        const on = land(la, lo); x.fillStyle = on ? `rgba(235,238,255,${.35 + z * .65})` : `rgba(110,130,255,${.08 + z * .3})`;
        x.beginPath(); x.arc(300 + R * Math.cos(p) * Math.sin(l), 300 - R * Math.sin(p), on ? 2.6 : 1.4, 0, 7); x.fill(); }
      pins.forEach(([la, lo]) => { const p = la * Math.PI / 180, l = (lo + a) * Math.PI / 180; if (Math.cos(p) * Math.cos(l) < .1) return;
        x.strokeStyle = '#6d7bff'; x.lineWidth = 3; x.beginPath(); x.arc(300 + R * Math.cos(p) * Math.sin(l), 300 - R * Math.sin(p), 7, 0, 7); x.stroke(); });
      a = (a + .15) % 360; requestAnimationFrame(draw); }; draw(); } },

{ id: 'eyes', kind: 'ui', w: 460, h: 340, vi: 'Mắt nhìn theo chuột', en: 'Watching eyes',

{ id: 'battery', kind: 'ui', w: 460, h: 340, vi: 'Pin thiết bị', en: 'Device batteries',

  js: (el) => { const rail = el.querySelector('.rail'), W = 230; // 230px = 1 giờ
    const tick = () => { const n = new Date(), h0 = n.getHours(), m = n.getMinutes(), base = h0 - 2;

      el.querySelector('.ev small').textContent = `${String(h0).padStart(2, '0')}:00 — ${String(h0 + 1).padStart(2, '0')}:00 · ${60 - m} min left`;
      let s = ''; for (let q = 0; q <= 16; q++) { const x = q * W / 4; s += `<i class="${q % 4 ? '' : 'h'}" style="left:${x}px"></i>` + (q % 4 ? '' : `<span style="left:${x}px">${String((base + q / 4 + 24) % 24).padStart(2, '0')}</span>`); }
      rail.innerHTML = s + `<b style="left:${W * 1.25}px;width:${W * .4}px;background:#7b8cff"></b><b style="left:${W * 2 + 4}px;width:${W - 8}px;background:#d91b6f">Design review</b>`;
      rail.style.transform = `translateX(${230 - W * 2 - m / 60 * W}px)`; };

{ id: 'mapsheet', kind: 'ui', w: 460, h: 340, vi: 'Bản đồ và thẻ địa điểm', en: 'Place sheet',

  html: `<div class="tx-map"><div class="ph"><div class="pin"><svg width="24" height="32" viewBox="0 0 24 32" aria-hidden="true"><path fill="#2f6df6" d="M12 0a12 12 0 0 1 12 12c0 9-12 20-12 20S0 21 0 12A12 12 0 0 1 12 0z"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg>Mora Bakery</div><div class="sheet"><h4>Mora Bakery</h4><p>Bakery · <b>Open</b> until 17:00 · 0.6 km</p><button type="button" class="tx-btn x" aria-label="Đóng">${I('x', 14)}</button><div class="acts"><button type="button" class="go">${I('nav', 16)}<span>12 min</span></button><button type="button">${I('phone', 16)}<span>Call</span></button><button type="button" aria-pressed="false" class="sv">${I('save', 16)}<span>Save</span></button><button type="button">${I('share', 16)}<span>Share</span></button></div></div></div></div>`,

  css: `.tx-table{width:460px;height:340px;padding:30px 30px 0;border-radius:22px;background:#ececec;font-family:Inter,system-ui,sans-serif;color:#111;box-sizing:border-box}

.tx-table li i{position:absolute;left:32px;top:0;bottom:0;width:calc((100% - 32px) * var(--w));border-radius:12px;background:#dcdcdc;transition:width .5s cubic-bezier(.2,.7,.2,1)}

.tx-table li b{color:#696969;font-weight:400}`,

{ id: 'toolbar', kind: 'ui', w: 460, h: 340, vi: 'Thanh định dạng nổi', en: 'Floating format bar',
  use: 'Trình soạn văn bản. Chọn chữ thì thanh nổi hiện lên. Mỗi nút bật tắt kiểu chữ, có nhóm ngăn bằng vạch.',
  css: `.tx-fmt{width:460px;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;border-radius:22px;background:#ececec;font-family:Inter,system-ui,sans-serif;color:#111}

.tx-fmt .txt.b{font-weight:700}.tx-fmt .txt.i{font-style:italic}.tx-fmt .txt.u{text-decoration:underline}.tx-fmt .txt.s{text-decoration:line-through}.tx-fmt .txt.u.s{text-decoration:underline line-through}
.tx-fmt .txt.k{font-family:ui-monospace,Menlo,monospace;font-size:26px}.tx-fmt .txt.l{color:#2433f0;text-decoration-color:#2433f0}
.tx-fmt .txt.li::before{content:"• "}
.tx-fmt .txt.n::after{content:"1";position:absolute;right:-12px;top:-12px;width:22px;height:22px;border-radius:50%;background:#f5b400;color:#111;font:600 11px/22px Inter;text-align:center}`,
  html: `<div class="tx-fmt"><div role="toolbar" aria-label="Định dạng">${[['B', 'b', 'Đậm'], ['I', 'i', 'Nghiêng'], ['U', 'u', 'Gạch dưới'], ['S', 's', 'Gạch ngang'], 0, ['link', 'l', 'Liên kết'], ['code', 'k', 'Mã'], 0, ['list', 'li', 'Danh sách'], ['note', 'n', 'Ghi chú']].map((b) => b ? `<button type="button" aria-pressed="false" aria-label="${b[2]}" data-f="${b[1]}">${I(b[0], 18)}</button>` : '<hr>').join('')}</div><span class="txt">Churn fell to 2.1%</span></div>`,
  js: (el) => { const t = el.querySelector('.txt'); el.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => b.setAttribute('aria-pressed', t.classList.toggle(b.dataset.f))); } }
];

const K = { web: ['Website', 'Hero website'], app: ['App', 'Màn app'], ui: ['Thành phần', 'Widget'] };
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const pretty = (h) => h.replace(/></g, '>\n<');
document.getElementById('tx-variants').textContent = BASE + '\n' + V.map((v) => v.css).join('\n');
document.getElementById('tx').innerHTML = Object.keys(K).map((k) => { const vs = V.filter((v) => v.kind === k);
  return `<section class="tx-sec" data-kind="${k}"><h2>${K[k][1]}<small>${vs.length}</small></h2><div class="tx-grid tx-grid--${k}">${vs.map((v) => `<article class="tx-card" id="${v.id}">
  <div class="tx-stage"><div class="tx-box" data-w="${v.w}" data-h="${v.h}"><div class="tx-fit" style="width:${v.w}px;height:${v.h}px">${v.html}</div></div></div>
  <div class="tx-foot"><h3>${v.vi}<small>${v.en}</small></h3><p>${v.use}</p>
  <details><summary>Code HTML + CSS${v.js ? ' + JS' : ''}</summary><div class="tx-code"><button type="button" class="aw-btn aw-btn--small" data-copy>Chép</button>
  <pre><code>${esc(`<style>\n${/tx-(phone|btn|dot)/.test(v.html) ? BASE + '\n' : ''}${v.css}\n</style>\n${pretty(v.html)}${v.js ? `\n<script>\n(${v.js})(document)\n<\/script>` : ''}`)}</code></pre></div></details></div></article>`).join('')}</div></section>`; }).join('');
V.forEach((v) => v.js && v.js(document.getElementById(v.id)));

// Lọc theo loại.
const chips = [['all', 'Tất cả', V.length], ...Object.keys(K).map((k) => [k, K[k][0], V.filter((v) => v.kind === k).length])];
const bar = document.getElementById('tx-chips');
bar.innerHTML = chips.map(([k, t, n], i) => `<button type="button" data-k="${k}" aria-pressed="${i === 0}">${t}<small>${n}</small></button>`).join('');
bar.onclick = (e) => { const b = e.target.closest('button'); if (!b) return;
  bar.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  document.querySelectorAll('.tx-sec').forEach((s) => s.hidden = b.dataset.k !== 'all' && s.dataset.kind !== b.dataset.k); fit(); };

// Mẫu vẽ ở cỡ thật rồi thu nhỏ cho vừa ô, không cắt.
const fit = () => document.querySelectorAll('.tx-box').forEach((b) => { const w = +b.dataset.w, h = +b.dataset.h, st = getComputedStyle(b.parentNode), room = b.parentNode.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  const k = Math.min(1, room / w); b.style.width = w * k + 'px'; b.style.height = h * k + 'px'; b.firstElementChild.style.transform = `scale(${k})`; });
fit(); addEventListener('resize', fit);
const k0 = new URLSearchParams(location.search).get('k'); if (K[k0]) bar.querySelector(`[data-k="${k0}"]`).click();   // link từ trang chủ: ?k=app | ?k=ui | ?k=web document.fonts.ready.then(fit);
document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard.writeText(b.nextElementSibling.textContent).then(() => { b.textContent = 'Đã chép'; setTimeout(() => b.textContent = 'Chép', 1500); }); });
</script>
