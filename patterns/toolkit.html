<script>
const rep = (k, f) => Array.from({ length: k }, (_, i) => f(i)).join('');
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
// Màu canvas đọc lại mỗi khung từ token của trang (sáng/tối).
const C = { ink: '#222', soft: '#ededed', dark: false };
const g = (v) => { const c = Math.round(C.dark ? 238 - v * 198 : 17 + v * 218); return `rgb(${c},${c},${c})`; };
const fit = (cv) => { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); } const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h); return [x, w, h]; };
const rot = ([x, y, z], ax, ay) => { const y1 = y * Math.cos(ax) - z * Math.sin(ax), z1 = y * Math.sin(ax) + z * Math.cos(ax); return [x * Math.cos(ay) + z1 * Math.sin(ay), y1, -x * Math.sin(ay) + z1 * Math.cos(ay)]; };
const typed = (el, s) => { if (el.textContent !== s) el.textContent = s; };

// Mỗi thẻ: dữ liệu repo + html demo (+ run(el) trả về hàm khung (t) cho demo chạy bằng JS).
const V = [
{ id: 'remotion-skills', vi: 'Kỹ năng video cho agent', en: 'Remotion Skills', use: 'Dạy agent dựng video bằng Remotion.', cat: 'Brief', repo: 'remotion-dev/skills', star: '7.8k', desc: 'agent guidance for video',
  html: `<div class="d-code"><div><span class="mu">$ </span><span data-t></span><i class="d-caret"></i></div><div class="d-ok">✓ video skills loaded</div><div class="d-chips">${['composition', 'timing', 'audio', 'render'].map((c) => `<span>${c}</span>`).join('')}</div></div>`,
  run: (el) => { const t0 = el.querySelector('[data-t]'), ok = el.querySelector('.d-ok'), ch = el.querySelectorAll('.d-chips span'), s = 'npx skills add remotion-dev/skills';
    return (t) => { const c = t % 7; typed(t0, s.slice(0, Math.floor(c / .05))); ok.classList.toggle('d-on', c > 2); ch.forEach((e, i) => e.classList.toggle('d-on', c > 2.4 + i * .3)); }; } },
{ id: 'anime-js', vi: 'Dòng thời gian và so le', en: 'anime.js', use: 'Timeline và chuyển động so le cho web.', cat: 'Animate', repo: 'juliangarnier/anime', star: '75k', desc: 'timelines and staggered motion',
  html: `<div class="d-dots">${rep(66, () => '<i></i>')}</div>`,
  run: (el) => { const d = [...el.querySelectorAll('i')];
    const P = [(x, y) => Math.hypot((x - 5) / 5, (y - 2.5) / 2.5) / 1.42, (x) => Math.abs(x - 5) / 5, (x, y) => 1 - Math.min(x, 10 - x, y * 2, (5 - y) * 2) / 5];
    return (t) => { const f = P[Math.floor(t / 2.6) % 3], w = (t % 2.6) / 2.6 * 1.6 - .3;
      d.forEach((e, k) => { const v = Math.max(0, 1 - Math.abs(w - f(k % 11, (k / 11) | 0)) * 3.2); e.style.transform = `scale(${.3 + .7 * v})`; e.style.opacity = .2 + .8 * v; }); }; } },
{ id: 'motion-canvas', vi: 'Đồ hoạ chuyển động bằng code', en: 'Motion Canvas', use: 'Viết animation như viết code, có timeline.', cat: 'Animate', repo: 'motion-canvas/motion-canvas', star: '20k', desc: 'code-driven motion graphics',
  html: `<pre class="d-pre"><span class="mu">yield* all(</span>\n  circle().scale(2,1),\n  rect().x(140,1));</pre><div class="mc"><i class="mc-c"></i><i class="mc-r"></i></div><div class="mc-t"><i></i></div>` },
{ id: 'd3-interpolate', vi: 'Nội suy màu và số', en: 'd3-interpolate', use: 'Chuyển mượt giữa hai giá trị, hai màu.', cat: 'Timing', repo: 'd3/d3-interpolate', star: '504', desc: 'interpolate colors and values',
  html: `<div class="d-ramp">${rep(10, (i) => `<i style="background:#${(0xf0 - i * 0x1b).toString(16).repeat(3)}"></i>`)}</div><i class="d-mark">▲</i><div class="d-num">50.0</div><div class="d-sub">interpolate(0, 100)</div>`,
  run: (el) => { const m = el.querySelector('.d-mark'), n = el.querySelector('.d-num');
    return (t) => { const p = .5 - .5 * Math.cos(t * 1.1); m.style.left = (5 + p * 90) + '%'; typed(n, (p * 100).toFixed(1)); }; } },
{ id: 'maath', vi: 'Toán cho đồ hoạ', en: 'maath', use: 'Hàm toán: điểm ngẫu nhiên, easing, vector.', cat: 'Math', repo: 'pmndrs/maath', star: '1.3k', desc: 'math helpers for interactive graphics',
  html: `<canvas></canvas><span class="d-lab">random.inSphere()</span>`,
  run: (el) => { const cv = el.querySelector('canvas'), r = rng(7), pts = [];
    while (pts.length < 120) { const p = [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1]; if (Math.hypot(...p) <= 1) pts.push(p); }
    return (t) => { const [x, w, h] = fit(cv), R = Math.min(w, h) * .38, cx = w / 2, cy = h / 2 - 6;
      x.strokeStyle = C.soft; x.lineWidth = 1; x.beginPath(); x.arc(cx, cy, R * 1.15, 0, 7); x.stroke(); x.fillStyle = C.ink;
      pts.map((p) => rot(p, .35, t * .5)).sort((a, b) => a[2] - b[2]).forEach(([px, py, pz]) => { x.globalAlpha = .3 + .35 * (pz + 1); x.beginPath(); x.arc(cx + px * R, cy + py * R, 1 + (pz + 1) * .7, 0, 7); x.fill(); });
      x.globalAlpha = 1; }; } },
{ id: 'three-js', vi: 'Cảnh 3D tương tác', en: 'three.js', use: 'Dựng cảnh 3D chạy trong trình duyệt.', cat: '3D', repo: 'mrdoob/three.js', star: '119k', desc: 'interactive 3D scenes',
  html: `<canvas></canvas>`,
  run: (el) => { const cv = el.querySelector('canvas'), f = 1.618, V0 = [], E = [];
    for (const s1 of [1, -1]) for (const s2 of [1, -1]) V0.push([0, s1, s2 * f], [s1, s2 * f, 0], [s2 * f, 0, s1]);
    V0.forEach((a, i) => V0.forEach((b, j) => { if (j > i && Math.abs(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) - 2) < .01) E.push([i, j]); }));
    return (t) => { const [x, w, h] = fit(cv), R = Math.min(w, h) * .26, P = V0.map((v) => rot(v, t * .35, t * .6));
      [false, true].forEach((front) => { x.strokeStyle = front ? C.ink : C.soft; x.lineWidth = front ? 1.3 : 1; x.beginPath();
        E.forEach(([a, b]) => { if ((P[a][2] + P[b][2] > 0) === front) { x.moveTo(w / 2 + P[a][0] * R, h / 2 + P[a][1] * R); x.lineTo(w / 2 + P[b][0] * R, h / 2 + P[b][1] * R); } }); x.stroke(); });
      x.fillStyle = C.ink; P.forEach((p) => { if (p[2] > 0) { x.beginPath(); x.arc(w / 2 + p[0] * R, h / 2 + p[1] * R, 2.2, 0, 7); x.fill(); } }); }; } },
{ id: 'blender', vi: 'Dựng hình và hoạt hình 3D', en: 'Blender', use: 'Phần mềm 3D trọn bộ: model, animate, render.', cat: '3D', repo: 'blender/blender', star: '22k', desc: '3D animation and rendering',
  html: `<canvas></canvas>`,
  run: (el) => { const cv = el.querySelector('canvas'), S = [];
    for (let u = 0; u < 30; u++) for (let v = 0; v < 9; v++) { const a = u / 30 * 6.283, b = v / 9 * 6.283; S.push([[(1 + .38 * Math.cos(b)) * Math.cos(a), .38 * Math.sin(b), (1 + .38 * Math.cos(b)) * Math.sin(a)], [Math.cos(b) * Math.cos(a), Math.sin(b), Math.cos(b) * Math.sin(a)]]); }
    return (t) => { const [x, w, h] = fit(cv), R = Math.min(w, h) * .3, ax = -1.1 + .25 * Math.sin(t * .7), ay = t * .6;
      S.map(([p, n]) => [rot(p, ax, ay), rot(n, ax, ay)]).sort((a, b) => a[0][2] - b[0][2]).forEach(([p, n]) => {
        const l = Math.max(0, -.4 * n[0] - .6 * n[1] + .7 * n[2]); x.fillStyle = g(.15 + .6 * l); x.strokeStyle = g(.1);
        x.lineWidth = .5; x.beginPath(); x.arc(w / 2 + p[0] * R, h / 2 + p[1] * R, R * .16 * (1 + p[2] * .12), 0, 7); x.fill(); x.stroke(); }); }; } },
{ id: 'bullet-physics', vi: 'Vật lý vật rắn', en: 'Bullet Physics', use: 'Va chạm, rơi, xếp chồng như thật.', cat: 'Physics', repo: 'bulletphysics/bullet3', star: '15k', desc: 'rigid bodies and collisions',
  html: `<i class="d-ground"></i>${[[-38, 0, 1], [38, 0, 1], [0, 0, 0], [-19, 1, 0], [19, 1, 0]].map(([dx, row, f]) => `<i class="d-box${f ? ' f' : ''}" style="left:calc(50% + ${dx - 17}px);bottom:${31 + row * 35}px"></i>`).join('')}`,
  run: (el) => { const B = [...el.querySelectorAll('.d-box')];
    return (t) => { const c = t % 6, fade = c > 5.3 ? (6 - c) / .7 : 1;

        e.style.transform = `translateY(${y}px) rotate(${r}deg)`; e.style.opacity = o; }); }; } },
{ id: 'three-mesh-bvh', vi: 'Raycast tăng tốc', en: 'three-mesh-bvh', use: 'Tăng tốc raycast và truy vấn mesh lớn.', cat: 'Speed', repo: 'gkjohnson/three-mesh-bvh', star: '3.6k', desc: 'accelerated raycasts and queries',

    return (t) => { const y = 20 + 116 * (.5 - .5 * Math.cos(t * 1.2)); let hx = 280;
      P.forEach((a, i) => { const b = P[(i + 1) % P.length]; if ((a[1] - y) * (b[1] - y) < 0) hx = Math.min(hx, a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); });
      ray.setAttribute('y1', y); ray.setAttribute('y2', y); ray.setAttribute('x2', hx); hit.setAttribute('cx', hx); hit.setAttribute('cy', y); hit.style.opacity = hx < 280 ? 1 : 0; }; } },
{ id: 'gl-react', vi: 'Shader WebGL trong React', en: 'gl-react', use: 'Ghép shader WebGL như component React.', cat: 'Shaders', repo: 'gre/gl-react', star: '3k', desc: 'compose WebGL shaders in React',
  html: `<canvas></canvas>`,
  run: (el) => { const cv = el.querySelector('canvas');
    return (t) => { const [x, w, h] = fit(cv), s = 7, nc = Math.floor(w / s), nr = Math.floor(h / s), ox = (w - nc * s) / 2;
      for (let i = 0; i < nc; i++) for (let j = 0; j < nr; j++) { const v = .5 + .5 * Math.sin(Math.hypot(i - nc / 2, j - nr / 2) * .7 - t * 3.2), q = Math.round(v * 4) / 4;
        x.fillStyle = q < .3 ? C.soft : g(1 - q); x.fillRect(ox + i * s, j * s, s - 1, s - 1); } }; } },

{ id: 'pixi-viewport', vi: 'Kéo và zoom khung nhìn', en: 'pixi-viewport', use: 'Pan, zoom, minimap cho cảnh PixiJS.', cat: 'Camera', repo: 'pixijs-userland/pixi-viewport', star: '1.2k', desc: 'pan and zoom for PixiJS scenes',
  html: `<div class="vp"><div class="vp-w"><i></i></div></div><div class="vp-m"><i></i></div>`,

{ id: 'tone-js', vi: 'Âm thanh và nhịp', en: 'Tone.js', use: 'Synth, sequencer, phát nhạc trên web.', cat: 'Audio', repo: 'Tonejs/Tone.js', star: '15k', desc: 'synths, sequencing and sound',

{ id: 'audiowaveform', vi: 'Dữ liệu sóng âm', en: 'audiowaveform', use: 'Sinh dữ liệu và ảnh waveform từ audio.', cat: 'Audio', repo: 'bbc/audiowaveform', star: '2.2k', desc: 'waveform data and images',

const panel = document.getElementById('tk'), stage = document.getElementById('tk-stage'), grid = document.getElementById('tk-grid');
const ct = document.getElementById('tk-ct'), eye = document.getElementById('tk-eye'), hd = document.getElementById('tk-h'), cta = document.getElementById('tk-cta');
const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = (n, k) => String(n).padStart(k, '0');
// 4 cột: xếp rắn như video (cột 1 xuống, cột 2 lên, ...), cột 2 nhô lên 28px.
grid.innerHTML = V.map((v, i) => { const c = i >> 2, k = i & 3, r = c % 2 ? 3 - k : k;
  return `<article class="tk-card" id="${v.id}" style="--i:${i};--c:${c + 1};--r:${r + 1};--y:${[0, -28, -10, 0][c]}px">
  <div class="tk-head"><div><h3><a href="https://github.com/${v.repo}" target="_blank" rel="noopener">${v.en}</a></h3><div class="tk-cat">${v.cat}</div></div><span class="tk-n">${pad(i + 1, 2)}</span></div>
  <div class="tk-demo" aria-hidden="true">${v.html}</div>
  <p class="tk-use">${v.vi}. ${v.use}</p>
  <div class="tk-foot"><span>${v.desc}</span><b>★ ${v.star}</b></div></article>`; }).join('');
const cards = [...grid.children];

// Vòng khung: chỉ chạy demo của thẻ đang thấy.
const frames = cards.map((c, i) => V[i].run ? V[i].run(c.querySelector('.tk-demo')) : null), vis = new Set();
const theme = () => { const s = getComputedStyle(panel); C.ink = s.getPropertyValue('--ink').trim(); C.soft = s.getPropertyValue('--soft').trim(); C.dark = document.documentElement.dataset.theme === 'dark'; };
if (rm) { theme(); frames.forEach((f) => f && f(2.2)); }
else {
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting ? vis.add(e.target._i) : vis.delete(e.target._i)));
  cards.forEach((c, i) => { c._i = i; io.observe(c); });
  const loop = (ms) => { theme(); vis.forEach((i) => frames[i] && frames[i](ms / 1000)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  // Intro: thẻ hiện so le theo số thứ tự khi khung vào tầm nhìn.
  panel.classList.add('tk-js');
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { panel.classList.add('is-in'); o.disconnect(); } }, { threshold: .05 }).observe(stage);
}

// Tour: thu khung về một màn, zoom tới từng thẻ 01→16, rồi về toàn lưới + tiêu đề cuối.
let timer = null, cur = 0, natural = 0;
const zoom = (i) => {
  const card = cards[i], cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length, W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.min([1, 1.3, 1.3, 1.75][cols - 1], (H - 24) / card.offsetHeight, (W - 24) / card.offsetWidth);
  const sy = parseFloat((getComputedStyle(card).translate.split(' ')[1]) || 0) || 0;
  const cx = card.offsetLeft + card.offsetWidth / 2, cy = card.offsetTop + sy + card.offsetHeight / 2;
  grid.style.transform = `translate(${W / 2 - grid.offsetLeft - s * cx}px,${H / 2 - grid.offsetTop - s * cy}px) scale(${s})`;
};
const go = (i) => {
  cur = i; cards.forEach((c, k) => c.classList.toggle('is-focus', k === i));
  ct.textContent = `${pad(i + 1, 3)} / 016`; eye.textContent = `${pad(i + 1, 2)} · ${V[i].repo}`; zoom(i);
};
const end = () => {
  clearInterval(timer); timer = null;
  panel.classList.remove('is-tour'); cards.forEach((c) => c.classList.remove('is-focus'));
  grid.style.transform = ''; stage.style.height = natural + 'px'; setTimeout(() => { if (!timer) stage.style.height = ''; }, rm ? 0 : 900);
  ct.textContent = '001–016'; eye.textContent = '370K+ STARS · $0 · 100% OPEN SOURCE'; hd.textContent = 'Build something worth watching.';
  cta.classList.add('is-fill'); cta.textContent = 'Xem lại tour ↻';
};
const start = () => {
  natural = stage.offsetHeight; stage.style.height = natural + 'px'; stage.offsetHeight;
  const room = innerHeight - 96 - (panel.offsetHeight - natural);
  stage.style.height = Math.min(natural, Math.max(340, room)) + 'px';
  panel.classList.add('is-tour'); hd.textContent = 'One motion studio.';
  cta.classList.remove('is-fill'); cta.textContent = 'Dừng tour ■';
  panel.scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block: 'start' });
  go(0); timer = setInterval(() => cur < 15 ? go(cur + 1) : end(), 1300);
};
cta.onclick = () => timer ? end() : start();
addEventListener('keydown', (e) => { if (e.key === 'Escape' && timer) end(); });
addEventListener('resize', () => { if (timer) zoom(cur); });
</script>
