<!doctype html><meta charset="utf-8"><body style="margin:0;background:#0f1419"><canvas id=c width=1200 height=800></canvas><script>
// Flow field: seeded noise, 6000 particle trails (phong cách algorithmic-art: seed cố định 20261102)
let s=20261102;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const c=document.getElementById('c'),x=c.getContext('2d');x.fillStyle='#0f1419';x.fillRect(0,0,1200,800);
const n=(a,b)=>Math.sin(a*.008+Math.cos(b*.006)*2)+Math.cos(b*.009+Math.sin(a*.005)*2);
const pal=['#e0b13a','#3aa6c4','#d96a5b','#e9f1ef'];
for(let i=0;i<5200;i++){let px=r()*1200,py=r()*800;x.beginPath();x.moveTo(px,py);x.strokeStyle=pal[i%4]+'55';x.lineWidth=.7;
for(let k=0;k<70;k++){const a=n(px,py)*Math.PI;px+=Math.cos(a)*2.2;py+=Math.sin(a)*2.2;x.lineTo(px,py)}x.stroke()}
</script>
