<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap");
* {

  display: block;
  height: auto;

body {

.lenis.lenis-smooth {
  scroll-behavior: auto;
}
.lenis.lenis-smooth [data-lenis-prevent] {

}

<body translate="no">
  <div class="app"><section>

  <script src='https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.23/bundled/lenis.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js'></script>
<script src='https://unpkg.com/split-type'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js'></script>
    <script id="rendered-js" >
const debounce = (func, timeout = 300) => {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => {func.apply(this, args);}, timeout);
  };
};

gsap.registerPlugin(ScrollTrigger);

// Scroll
const lenis = new Lenis({
  lerp: 0.07 });


lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add(time => {
  lenis.raf(time * 1000);
});

// Reveal animation
const setTextRevealAnimations = () => {
  document.querySelectorAll('.text-reveal').forEach(text => {
    // Split text
    let splitText = new SplitType(text);

    splitText.lines.forEach(line => {
      const lineWrapper = document.createElement('div');
      lineWrapper.classList.add('line-wrapper');
      text.insertAdjacentElement('beforeEnd', lineWrapper);
      lineWrapper.appendChild(line);
    });

    // Animation
    const section = text.closest('section');
    gsap.to(splitText.lines, {
      y: 0,
      ease: "power1.inOut",
      stagger: .15,
      scrollTrigger: {
        trigger: text,
        start: 'top bottom',
        // markers: true,
        toggleActions: 'play reset play reset' } });


  });
};

setTextRevealAnimations();

// Handle resize
const resizeObserver = new ResizeObserver(
debounce(([entry]) => {
  setTextRevealAnimations();
}, 500));

resizeObserver.observe(document.body);
//# sourceURL=pen.js
  </script>
