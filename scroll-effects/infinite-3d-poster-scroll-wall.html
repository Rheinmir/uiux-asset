    <script id="rendered-js" >
let assetGroupY = 0;
let scrollStatus = false;
let waitForIt;
let frameCount = 1;
const urlParams = new URLSearchParams(window.location.search);
let disableAnimate = urlParams.get('disableAnimate');
const posterCollection = [];
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer();
const posterShape = new THREE.Shape();
const posterSize = {
  h: 40,
  w: 27,
  padding: 2,
  cols: 11,
  rows: 10,
  resIndex: 2 };


const canvasSize = {
  h: window.innerWidth * 414 / 1075,
  w: window.innerWidth };


renderer.setPixelRatio(window.devicePixelRatio);

roundedRect(posterShape, 0, 0, posterSize.w, posterSize.h, 3);
const posterGeometry = new THREE.ShapeGeometry(posterShape);

const startingY = -posterSize.h - posterSize.padding;
const assetGroup = new THREE.Group();
assetGroup.position.y = startingY;
assetGroup.position.x = -(posterSize.w * posterSize.cols + (posterSize.padding * posterSize.cols - 1)) / 2; // offset and center
scene.add(assetGroup);

const camera = new THREE.PerspectiveCamera(75, canvasSize.w / canvasSize.h * .5, .01, 1000);
camera.rotation.x = .6;
camera.position.z = 100;
camera.position.y = posterSize.h * 1.5;

const spotLight = new THREE.PointLight(0xffffff, 2500, 500);
spotLight.position.x = 0;
spotLight.position.y = posterSize.h * 1.5;
spotLight.position.z = 50;
scene.add(spotLight);

init();
animate();

renderer.setSize(canvasSize.w, canvasSize.h);
document.querySelector('.posters').prepend(renderer.domElement);
document.addEventListener('mousewheel', e => {
  clearTimeout(waitForIt);
  scrollStatus = true;
  scrollPosters(Math.abs(e.deltaY));

  waitForIt = window.setTimeout(() => {
    scrollStatus = false;
  }, 50);
});


function animate() {
  if (frameCount % 3 === 0) {
    if (!scrollStatus && !disableAnimate) {
      scrollPosters(.3);
    }

    frameCount = 1;

    assetGroup.position.y = assetGroupY;
    renderer.render(scene, camera);
  } else {
    frameCount++;
  }
  requestAnimationFrame(animate);
}

function scrollPosters(moveY = .1) {
  if (assetGroup.position.y >= 0) {
    loopPosters();
    assetGroupY = startingY;
  } else {
    assetGroupY += moveY;
  }
}

function loopPosters() {
  if (posterCollection.length) {
    const lastY = posterSize.h * posterCollection.length + posterSize.padding * (posterCollection.length - 1);

    for (let i = 0; i < posterCollection.length; i++) {
      const row = posterCollection[i];

      if (row.position.y >= lastY) {
        row.position.y = -startingY;
      } else {
        row.position.y += -startingY;;
      }
    }
  }
}

async function init() {
  const peacockProvider = [386, 387];
  const apiKey = '17f6c7973c2ed29ef001953add2d04d3';
  const config = await fetchConfig();
  const assetList = shuffleList([
  ...(await fetchAssetList('tv', 1)).results,
  ...(await fetchAssetList('tv', 2)).results,
  ...(await fetchAssetList('tv', 3)).results,
  ...(await fetchAssetList('movie', 1)).results,
  ...(await fetchAssetList('movie', 2)).results,
  ...(await fetchAssetList('movie', 3)).results]).
  splice(0, posterSize.cols * posterSize.rows);

  renderPosters(config.images, assetList);

  function fetchAndStore(key, url) {
    const storage = localStorage.getItem(key);

    if (storage) {
      return Promise.resolve(JSON.parse(storage));
    } else {
      return fetch(url).
      then(response => response.json()).
      then(data => {
        localStorage.setItem(key, JSON.stringify(data));
        return data;
      });
    }
  }

  async function fetchConfig() {
    return fetchAndStore('tmdbConfig', `https://api.themoviedb.org/3/configuration?api_key=${apiKey}`);
  }

  async function fetchAssetList(type = 'movie', page = 1) {
    const url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&include_adult=true&sort_by=popularity.desc&language=en-US&page=${page}&watch_region=US&with_watch_providers=${peacockProvider.join('|')}&with_networks=3353`;

    return fetchAndStore(`tmdbAssetList${type}${page}`, url);
  }

  function createImageURL(baseUrl, size, path) {
    return `${baseUrl}${size}${path}`;
  }

  function filterProviders(remove, providers) {
    return providers.map(provider => {
      return provider.provider_id;
    }).filter(providerId => {
      if (remove.indexOf(providerId) === -1) {
        return true;
      }
    });
  }

  function renderPosters(config, assetList) {
    let x = 0;
    let y = 0;
    let textureLoader = new THREE.TextureLoader();
    let rowGroup;

    assetList.forEach((asset, i) => {
      if (i % posterSize.cols === 0) {
        y += posterSize.h + posterSize.padding;
        x = 0;

        rowGroup = new THREE.Group();
        rowGroup.position.y = y;
        assetGroup.add(rowGroup);
        posterCollection.push(rowGroup);
      } else {
        x += posterSize.w + posterSize.padding;
      }



      const url = createImageURL(config.secure_base_url, config.poster_sizes[posterSize.resIndex], asset.poster_path);

      const posterTexture = textureLoader.load(url);
      posterTexture.colorSpace = THREE.SRGBColorSpace;
      posterTexture.wrapS = posterTexture.wrapT = THREE.RepeatWrapping;
      posterTexture.repeat.set(.037, .025);

      const material = new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        map: posterTexture });


      const poster = new THREE.Mesh(posterGeometry, material);
      poster.position.x = x;
      poster.name = asset.name || asset.title;

      rowGroup.add(poster);
      rowGroup.name += `${poster.name},`;
    });
  }

  function shuffleList(list) {
    const newList = [];

    while (list.length > 0) {
      const random = Math.floor(Math.random() * list.length);
      newList.push(list.splice(random, 1)[0]);
    }

    return newList;
  }
}

function roundedRect(ctx, x, y, width, height, radius) {
  ctx.moveTo(x, y + radius);
  ctx.lineTo(x, y + height - radius);
  ctx.quadraticCurveTo(x, y + height, x + radius, y + height);
  ctx.lineTo(x + width - radius, y + height);
  ctx.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
  ctx.lineTo(x + width, y + radius);
  ctx.quadraticCurveTo(x + width, y, x + width - radius, y);
  ctx.lineTo(x + radius, y);
  ctx.quadraticCurveTo(x, y, x, y + radius);
}

window.stopAnimation = () => {
  disableAnimate = 'true';
};
