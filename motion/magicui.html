new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); sync();

let cur = null, seq = 0;
const RT = {
  un: null,
  async mount(m, host) { const [{ createElement }, { createRoot }] = await Promise.all([import('react'), import('react-dom/client')]); const root = createRoot(host); root.render(createElement(m.default)); RT.un = () => root.unmount(); },
};
const tag = (real) => { const b = $('badge'); b.className = 'aw-tag aw-tag--small m-badge ' + (real ? 'aw-tag--solid-green' : 'aw-tag--solid-yellow'); b.textContent = real ? 'THƯ VIỆN THẬT' : 'MÔ PHỎNG'; };
async function show(id) {
  const t = TABS.find((x) => x.id === id) || TABS[0], my = ++seq; cur = t;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.id === t.id));
  tag(t.real); $('note').textContent = t.note;
  if (t.demo) { t.code = 'export { ' + (t.exp || 'default') + ' as default } from "/' + t.demo + '"'; if (!t.shown) t.shown = fetch(RAW(t.demo)).then((r) => r.text()).then((x) => x.replace(/^export const controls[\s\S]*?\n}\n\n/m, '')).catch(() => '// (không tải được mã demo)'); }
  const body = t.demo ? await t.shown : t.code; if (my !== seq) return;
  const src = (t.real ? '// Nguồn thật · ' + CFG.license + '\n// ' + (t.src || (t.demo ? [t.demo] : [])).map((p) => 'github.com/' + CFG.repo + '/blob/' + CFG.sha.slice(0, 7) + '/' + p).join('\n//   ') + '\n' : '// MÔ PHỎNG web-native: không phải mã nguồn của repo.\n') + body;
  $('code').textContent = src;
  if (RT.un) { RT.un(); RT.un = null; }
  $('mount').replaceChildren(); $('st').textContent = 'đang nạp ' + t.label + '…';
  try {
    const url = await vmod('demo:' + t.id, t.code);
    if (my !== seq) return;
    const host = document.createElement('div'); host.style.cssText = 'width:100%;display:grid;place-items:center'; $('mount').append(host);
    const m = await import(url); if (my !== seq) return;
    await RT.mount(m, host, t);
    $('st').textContent = CFG.name + ' · ' + t.label + ' · đang chạy';
  } catch (e) { if (my === seq) { $('mount').innerHTML = '<div class="m-err"></div>'; $('mount').firstChild.textContent = 'Lỗi nạp tab "' + t.label + '": ' + (e && e.message || e); console.error(e); $('st').textContent = 'lỗi'; } }
}

const go = (id) => { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); show(id); };
(async () => {
  sucrase = await import('https://esm.sh/sucrase@3.35.0');
  if (CFG.files) tree = new Set(CFG.files);
  else { const j = await (await fetch('https://data.jsdelivr.com/v1/packages/gh/' + CFG.repo + '@' + CFG.sha + '?structure=flat')).json(); tree = new Set(j.files.map((f) => f.name.slice(1))); }
  if (CFG.tailwind !== false) await tailwind();
  if (CFG.boot) await CFG.boot();
  const bar = $('tabs');
  for (const t of TABS) { const b = document.createElement('button'); b.type = 'button'; b.role = 'tab'; b.dataset.id = t.id; b.textContent = t.label; b.onclick = () => go(t.id); bar.append(b); }
  $('replay').onclick = () => { mods.delete('demo:' + cur.id); show(cur.id); };
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})().catch((e) => { $('st').textContent = 'lỗi nạp: ' + e.message; console.error(e); });
</script>
